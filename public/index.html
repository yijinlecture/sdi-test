<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SDI 시설 신고함</title>
<style>
  /* 색은 SPEC.md 3절 화면 규칙 */
  :root { --bg:#f4f6f8; --card:#fff; --ink:#1b2129; --muted:#5d6673; --line:#d9dde3; --ai:#4a4fae; --ai-bg:#eef0fb;
          --urgent:#c62828; --warning:#d46a00; --info:#6b7480;
          --open:#1f5fbf; --assigned:#a37500; --resolved:#2b7a3d; }
  * { box-sizing: border-box; }
  [hidden] { display:none !important; } /* hidden 속성이 아래 display 규칙에 덮이지 않게 */
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.6 "Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 100px; display:flex; flex-direction:column; gap:16px; }
  h1 { margin:0; font-size:1.5rem; }
  .box { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
  form { display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
  form label { display:flex; flex-direction:column; gap:4px; font-size:.85rem; color:var(--muted); }
  form .wide { grid-column: 1 / -1; }
  input, select, textarea { font:inherit; padding:7px 9px; border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--ink); }
  textarea { min-height: 60px; resize: vertical; width:100%; }
  button { font:inherit; padding:6px 12px; border-radius:6px; border:1px solid var(--line); background:#fff; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  button.primary { background:var(--ink); color:#fff; border-color:var(--ink); }
  button.ai { color:var(--ai); border-color:var(--ai); }
  .error { color:var(--urgent); min-height:1.4em; margin:0; grid-column: 1 / -1; }
  .tabs { display:flex; gap:8px; flex-wrap:wrap; }
  .tabs button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .list { display:flex; flex-direction:column; gap:10px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; display:flex; flex-direction:column; gap:6px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .title { font-weight:600; flex:1; min-width: 12em; }
  .meta { font-size:.85rem; color:var(--muted); }
  .badge { font-size:.75rem; font-weight:600; padding:1px 8px; border-radius:4px; border:1px solid transparent; white-space:nowrap; }
  .sev-urgent { background:#fde4e2; color:var(--urgent); }
  .sev-warning { background:#fcecd9; color:var(--warning); }
  .sev-info { background:#eceef1; color:var(--info); }
  .sev-none { background:#fff; color:var(--info); border:1px dashed var(--info); }
  .st-open { background:#e2ecfa; color:var(--open); }
  .st-assigned { background:#fbf1cf; color:var(--assigned); }
  .st-resolved { background:#e0f0e4; color:var(--resolved); }
  .ai-box { background:var(--ai-bg); border-radius:6px; padding:8px 10px; font-size:.88rem; display:flex; flex-direction:column; gap:6px; }
  .ai-box b { color:var(--ai); }
  .note { font-size:.8rem; color:var(--muted); }
  /* AC-13: 승인 · 거절 표시 */
  .ai-approved { background:var(--ai-bg); color:var(--ai); }
  .ai-rejected { background:#f1f1f1; color:var(--muted); }
  .hold { color:var(--urgent); font-weight:600; }
  /* AC-14: 긴급 카드는 왼쪽 빨간 굵은 띠 · 휴대폰에서는 제목도 빨갛고 크게 */
  .card.urgent { border-left:6px solid var(--urgent); }
  @media (max-width: 560px) { .card.urgent .title { color:var(--urgent); font-size:1.05rem; } }
  .empty { color:var(--muted); text-align:center; padding:24px; }
  /* 실습 1-6: 우측 하단 챗봇 */
  #chat-open { position:fixed; right:20px; bottom:20px; border-radius:999px; padding:10px 16px; background:var(--ai); color:#fff; border:0; box-shadow:0 4px 14px rgba(0,0,0,.15); }
  #chat { position:fixed; right:20px; bottom:76px; width:min(360px, calc(100vw - 40px)); height:440px; background:#fff; border:1px solid var(--line); border-radius:12px; box-shadow:0 8px 28px rgba(0,0,0,.18); display:flex; flex-direction:column; }
  #chat header { padding:10px 14px; border-bottom:1px solid var(--line); font-weight:600; display:flex; justify-content:space-between; }
  #chat-log { flex:1; overflow-y:auto; padding:10px 14px; display:flex; flex-direction:column; gap:8px; font-size:.9rem; }
  .bubble { padding:7px 10px; border-radius:10px; max-width:85%; white-space:pre-wrap; }
  .bubble.user { align-self:flex-end; background:var(--ink); color:#fff; }
  .bubble.assistant { align-self:flex-start; background:var(--ai-bg); }
  #chat form { display:flex; gap:6px; padding:10px; border-top:1px solid var(--line); }
  #chat input { flex:1; }
  @media (max-width: 560px) { form { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>SDI 시설 신고함</h1>

  <section class="box">
    <form id="new-report">
      <label class="wide">제목 <input id="f-title" maxlength="100" placeholder="예: 2층 천장에서 물이 샙니다"></label>
      <label>장소 <input id="f-location" maxlength="50" placeholder="예: 사무동 2F 복도"></label>
      <label>건물
        <select id="f-building"><option value="office">사무동</option><option value="plant">생산동</option></select>
      </label>
      <label>설비 번호 (선택) <input id="f-asset" maxlength="20" placeholder="예: PR-3F-02"></label>
      <label>이름 <input id="f-name" maxlength="20" placeholder="예: 김OO"></label>
      <label class="wide">내용 <textarea id="f-body" maxlength="1000" placeholder="본 그대로 적어 주세요"></textarea></label>
      <p class="error" id="form-error"></p>
      <div class="wide"><button class="primary" type="submit">신고</button></div>
    </form>
  </section>

  <nav class="tabs" id="tabs"></nav>
  <section class="list" id="list"><p class="empty">불러오는 중…</p></section>
</main>

<button id="chat-open">💬 시설 도우미</button>
<section id="chat" hidden>
  <header>시설 도우미 <button id="chat-close" aria-label="닫기">✕</button></header>
  <div id="chat-log"><div class="bubble assistant">신고 방법 · 회의실 장비 · 와이파이처럼 시설에 관한 것을 물어보세요.</div></div>
  <form id="chat-form"><input id="chat-input" maxlength="500" placeholder="질문을 입력하세요"><button class="primary">보내기</button></form>
</section>

<script type="module">
import { severityBadge, statusBadge, aiStatusBadge, cardClass, CATEGORY, BUILDING } from "./format.js";

const HANDLERS = ["이주임", "최대리", "정사원", "한과장"];
let tab = "all"; // 지금 고른 상태 탭
const recommendations = {}; // 신고 번호 → 담당 추천 결과 (화면에만 보여 줌 · 배정은 사람이)

// ── 서버와 이야기하는 곳 ──
async function api(method, url, body) {
  const res = await fetch(url, { method, headers: body ? { "Content-Type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined });
  const data = await res.json().catch(() => null);
  if (!res.ok) throw new Error(data?.error?.message || `오류가 났습니다 (${res.status})`);
  return data;
}
// 글자가 흘러오는 응답(안내문 초안 · 챗봇): 받는 대로 onText로
async function streamApi(url, body, onText) {
  const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
  if (!res.ok) {
    const data = await res.json().catch(() => null);
    throw new Error(data?.error?.message || `오류가 났습니다 (${res.status})`);
  }
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let full = "";
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    full += decoder.decode(value, { stream: true });
    onText(full);
  }
  return full;
}

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const when = (iso) => { const d = new Date(iso); return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; };
const badge = ({ label, cls }) => `<span class="badge ${cls}">${esc(label)}</span>`;

// AI 제안 상자 (실습 1-2): 제안은 보이지만 배지는 [승인] 전까지 그대로
function aiBox(t) {
  if (t.ai_status === "suggested") {
    const hold = Number(t.ai_hold) === 1 ? `<span class="hold">판단 보류 · 사람 확인 필요</span>` : ""; // 미션 ①
    return `<div class="ai-box">${hold}<span><b>AI 제안</b> · ${esc(severityBadge(t.ai_severity).label)} · ${esc(CATEGORY[t.ai_category] || t.ai_category)} — ${esc(t.ai_reason)}</span>
      <div class="row"><button class="primary" data-approve="${t.id}">승인</button><button data-reject="${t.id}">거절</button><span class="note">승인해야 배지가 바뀝니다</span></div></div>`;
  }
  return "";
}
function recommendBox(t) {
  const r = recommendations[t.id];
  if (!r) return "";
  return `<div class="ai-box"><span><b>담당 추천</b> · ${esc(r.name)} — ${esc(r.reason)}</span><span class="note">조회한 도구: ${esc(r.tools.join(", ") || "없음")} · 배정은 아래 담당 칸에서 직접 고르세요</span></div>`;
}
function draftBox(t) {
  if (t.answer) return `<div class="ai-box"><span><b>보낸 안내문</b></span><span>${esc(t.answer)}</span></div>`;
  return `<div class="ai-box" id="draft-${t.id}" hidden><span><b>안내문 초안</b> · 고친 뒤 [보내기]를 눌러야 저장됩니다</span>
    <textarea id="draft-text-${t.id}"></textarea><div class="row"><button class="primary" data-send="${t.id}">보내기</button><span class="note" id="draft-note-${t.id}"></span></div></div>`;
}

// 카드 아래쪽: 접수 → 담당 고르기 / 배정 → 담당 + [완료] / 완료 → 담당만
function footer(t) {
  const ai = `<button class="ai" data-classify="${t.id}">AI 분류</button>${t.status === "open" ? `<button class="ai" data-recommend="${t.id}">담당 추천</button>` : ""}${t.answer ? "" : `<button class="ai" data-draft="${t.id}">안내문 초안</button>`}`;
  // 미션 ②: 사람이 심각도를 직접 정함 (AI와 다르면 평가셋 후보가 됨)
  const sev = `<label class="meta">심각도 <select data-severity="${t.id}"><option value="">직접 정하기</option><option value="urgent">긴급</option><option value="warning">주의</option><option value="info">정보</option></select></label>`;
  if (t.status === "open") {
    return `<div class="row"><label class="meta">담당 <select data-assign="${t.id}"><option value="">고르세요</option>${HANDLERS.map((h) => `<option>${h}</option>`).join("")}</select></label>${sev}${ai}</div>`;
  }
  if (t.status === "assigned") return `<div class="row"><span class="meta">담당: ${esc(t.assignee)}</span><button data-done="${t.id}">완료</button>${sev}${ai}</div>`;
  return `<span class="meta">담당: ${esc(t.assignee)}</span>`;
}

function card(t) {
  const aiDone = aiStatusBadge(t.ai_status);
  return `<article class="${cardClass(t)}" id="card-${t.id}">
    <div class="row">${badge(severityBadge(t.severity))}<span class="title">${esc(t.title)}</span>${aiDone ? badge(aiDone) : ""}${badge(statusBadge(t.status))}</div>
    <div class="meta">${esc(BUILDING[t.building] || "")} · ${esc(t.location)}${t.asset_id ? " · " + esc(t.asset_id) : ""} · ${esc(t.reporter_name)} · ${when(t.created_at)}</div>
    ${t.body ? `<div>${esc(t.body)}</div>` : ""}
    ${aiBox(t)}${recommendBox(t)}${draftBox(t)}
    ${footer(t)}
  </article>`;
}

async function load() {
  try {
    const all = await api("GET", "/api/reports");
    const count = (s) => all.filter((t) => t.status === s).length;
    $("tabs").innerHTML = [["all", "전체", all.length], ["open", "접수", count("open")], ["assigned", "배정", count("assigned")], ["resolved", "완료", count("resolved")]]
      .map(([k, label, n]) => `<button data-tab="${k}" class="${tab === k ? "on" : ""}">${label} ${n}</button>`).join("");
    const rows = tab === "all" ? all : await api("GET", "/api/reports?status=" + tab);
    $("list").innerHTML = rows.length ? rows.map(card).join("") : `<p class="empty">신고가 없습니다</p>`;
  } catch (e) {
    $("list").innerHTML = `<p class="empty">목록을 불러오지 못했습니다: ${esc(e.message)}</p>`;
  }
}

// ── 신고하기 ──
$("new-report").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  $("form-error").textContent = "";
  try {
    await api("POST", "/api/reports", {
      title: $("f-title").value, location: $("f-location").value, building: $("f-building").value,
      asset_id: $("f-asset").value, reporter_name: $("f-name").value, body: $("f-body").value,
    });
    ev.target.reset();
    await load();
  } catch (e) {
    $("form-error").textContent = e.message;
  }
});

// ── 버튼들 (다시 그려져도 동작하도록 한 곳에서 받음) ──
document.addEventListener("click", async (ev) => {
  const el = ev.target.closest("button");
  if (!el || !el.dataset) return;
  const d = el.dataset;
  try {
    if (d.tab) { tab = d.tab; await load(); }
    if (d.done) { await api("PATCH", `/api/reports/${d.done}`, { status: "resolved" }); await load(); }
    if (d.classify) { el.disabled = true; el.textContent = "분류 중…"; await api("POST", `/api/reports/${d.classify}/classify`); await load(); }
    if (d.approve) { await api("POST", `/api/reports/${d.approve}/approve`); await load(); }
    if (d.reject) { await api("POST", `/api/reports/${d.reject}/reject`); await load(); }
    if (d.recommend) { el.disabled = true; el.textContent = "추천 중…"; recommendations[d.recommend] = await api("POST", `/api/reports/${d.recommend}/recommend`); await load(); }
    if (d.draft) {
      const id = d.draft;
      $(`draft-${id}`).hidden = false;
      el.disabled = true;
      $(`draft-note-${id}`).textContent = "글자가 흘러오는 중…";
      let got = ""; // 지금까지 받은 글
      try {
        const text = await streamApi(`/api/reports/${id}/draft`, {}, (sofar) => { got = sofar; $(`draft-text-${id}`).value = sofar; });
        $(`draft-note-${id}`).textContent = text.includes("[연결 끊김]") ? "중간에 끊겼습니다. 받은 글은 남아 있어요" : "다 받았습니다. 고친 뒤 [보내기]";
      } catch (e) {
        if (!got) throw e; // 한 글자도 못 받았으면 아래 공통 처리(안내 창)
        // 받는 중에 서버와 연결이 끊김(예: 서버 Ctrl+C) → 받은 글은 그대로 두고 안내 한 줄 (목록을 다시 불러오지 않음)
        $(`draft-note-${id}`).textContent = "서버와 연결이 끊겼습니다. 받은 글은 남아 있어요 — 서버를 다시 켠 뒤 [보내기]";
      }
      el.disabled = false;
    }
    if (d.send) { await api("PATCH", `/api/reports/${d.send}`, { answer: $(`draft-text-${d.send}`).value }); await load(); }
  } catch (e) {
    alert(e.message); // 예: 지금은 AI를 쓸 수 없습니다 … 직접 처리해 주세요
    await load();
  }
});
document.addEventListener("change", async (ev) => {
  const el = ev.target;
  if (!el.value) return;
  try {
    if (el.dataset.assign) { await api("PATCH", `/api/reports/${el.dataset.assign}`, { assignee: el.value }); await load(); }
    if (el.dataset.severity) { await api("PATCH", `/api/reports/${el.dataset.severity}`, { severity: el.value }); await load(); }
  } catch (e) { alert(e.message); }
});

// ── 실습 1-6: 챗봇 · API는 기억이 없어서 대화는 화면이 들고 있다가 최근 10턴(20개)만 보냄 ──
const history = [];
const bubble = (role, text) => { const b = document.createElement("div"); b.className = `bubble ${role}`; b.textContent = text; $("chat-log").append(b); $("chat-log").scrollTop = 1e9; return b; };
$("chat-open").onclick = () => { $("chat").hidden = !$("chat").hidden; };
$("chat-close").onclick = () => { $("chat").hidden = true; };
$("chat-form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const q = $("chat-input").value.trim();
  if (!q) return;
  $("chat-input").value = "";
  history.push({ role: "user", content: q });
  bubble("user", q);
  const b = bubble("assistant", "…");
  try {
    const answer = await streamApi("/api/chat", { messages: history.slice(-20) }, (sofar) => { b.textContent = sofar; $("chat-log").scrollTop = 1e9; });
    history.push({ role: "assistant", content: answer });
  } catch (e) {
    b.textContent = e.message;
    history.pop(); // 답을 못 받은 질문은 기록에서 뺌
  }
});

load();
</script>
</body>
</html>
